<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Olho espiando da pose graduation. Sobrepor 1:1 ao graduation.png.
       Em repouso, o grupo peek-eye-right fica invisível (aparece o olho fechado original).
       Para espiar: mostre o grupo e anime peek-slit (scaleY de 0 a 1, a partir da linha da pálpebra). -->
  <defs>
    <clipPath id="clip-peek"><path d="M650 548 Q735 560 822 546 Q790 592 736 596 Q682 594 650 548 Z"/></clipPath>
  </defs>
  <g id="peek-eye-right">
    <ellipse id="peek-cover" cx="736" cy="558" rx="104" ry="46" fill="#FC4800"/>
    <g id="peek-slit">
      <path id="peek-white" d="M650 548 Q735 560 822 546 Q790 592 736 596 Q682 594 650 548 Z" fill="#FCFCFC"/>
      <g clip-path="url(#clip-peek)">
        <g id="peek-pupil">
          <circle cx="748" cy="584" r="27" fill="#141216"/>
          <circle id="peek-shine" cx="758" cy="572" r="8" fill="#FFFFFF"/>
        </g>
      </g>
      <path id="peek-lower-lid" d="M654 552 Q684 592 736 596 Q790 592 818 550" fill="none" stroke="#141216" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path id="peek-upper-lid" d="M642 546 Q735 562 828 544" fill="none" stroke="#141216" stroke-width="13" stroke-linecap="round"/>
    <path id="peek-lash" d="M824 545 L842 530" fill="none" stroke="#141216" stroke-width="9" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

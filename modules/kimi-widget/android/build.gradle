// Kimi widget module: shared storage (SharedPreferences), the Jetpack Glance widgets and the
// round timer foreground service.
// Glance needs the Compose compiler plugin, same setup as expo-dev-menu / expo-modules-core.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'br.com.kimi'
version = '1.0.0'

android {
  namespace "br.com.kimi.widget"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation "androidx.glance:glance-appwidget:1.1.1"
  // NotificationCompat (round timer foreground notification).
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}

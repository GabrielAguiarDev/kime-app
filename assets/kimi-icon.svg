  <path d="M0 680 Q512 640 1024 680 L1024 860 Q512 900 0 860 Z" fill="#3A3D42"/>
  <!-- Faixa laranja (máscara) -->
  <path d="M0 330 Q512 290 1024 330 L1024 690 Q512 730 0 690 Z" fill="#D9400A"/>
  <!-- Olho esquerdo -->
  <circle cx="330" cy="520" r="150" fill="#FFFFFF"/>
  <circle cx="352" cy="548" r="74" fill="#2A2C30"/>
  <circle cx="380" cy="512" r="20" fill="#FFFFFF"/>
  <!-- Pálpebra brava esquerda (desce em direção ao centro) -->
  <polygon points="160,350 520,350 520,478 160,392" fill="#D9400A"/>
  <!-- Olho direito -->
  <circle cx="694" cy="520" r="150" fill="#FFFFFF"/>
  <circle cx="672" cy="548" r="74" fill="#2A2C30"/>
  <circle cx="700" cy="512" r="20" fill="#FFFFFF"/>
  <!-- Pálpebra brava direita -->
  <polygon points="504,350 864,350 864,392 504,478" fill="#D9400A"/>
</svg>
